schema_version: 1
name: fixed_basket_hold_real
description: 真实价撮合对账：聚宽 use_real_price=True 与 SVQuant unadjusted 严格比较股数、成交价、现金与费用；区间避开除息日

jq:
  # 在聚宽平台创建回测后把 ID 填到这里
  backtest_id: "<在此填写聚宽回测 ID>"
  frequency: day
  run_time: "09:30"
  start: "2024-01-02"
  # 避开 000001.SZ 2024-06-14 除息，隔离公司行为处理差异
  end: "2024-06-13"
  initial_cash: 100000000
  benchmark: "000300.XSHG"
  options:
    # 关键：聚宽用真实价格成交、整手和计费
    use_real_price: true
    slippage_rate: 0.0
    commission: 0.0003
    stamp_tax: 0.0005
    min_commission: 5

svquant:
  engine_mode: event
  strategy_source: svquant_strategy.py
  execution_timing: next_open
  # 成交/估值用未复权价；信号仍用后复权
  execution_price_source: unadjusted
  universe: CSI300
  benchmark: CSI300
  initial_capital: 100000000
  commission_rate: 0.0003
  stamp_tax: 0.0005
  min_commission: 5
  slippage_rate: 0.0

comparison:
  # 两侧都是真实价，股数/价格/现金/费用全部严格比较
  price_basis: real
  strict_layers: [L0, L1, L2, L3, L4, L5]
  acceptance: strict

tolerances:
  quantity: 0
  price_abs: 0.005
  cash_abs: 0.01
  equity_rel: 1.0e-6
  return_abs: 1.0e-3
  metric_rel: 1.0e-3
