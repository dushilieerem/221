schema_version: 1
name: dividend_lowvol_growth
description: 公司策略「红利低波+红利成长」：双池各 5 只、月频调仓、行业分散与涨停跳过

jq:
  backtest_id: "company-dividend-lowvol-growth"
  frequency: day
  run_time: "09:30"
  start: "2017-01-12"
  end: "2026-07-21"
  initial_cash: 100000
  benchmark: "000015.XSHG"
  options:
    use_real_price: true
    slippage: price_related_0.002
    commission: 0.0001
    stamp_tax: 0.0005
    min_commission: 5

svquant:
  engine_mode: event
  strategy_source: jq_strategy.py
  strategy_dialect: joinquant
  timed_execution: true
  execution_timing: next_open
  execution_price_source: unadjusted
  # 全市场 A 股；策略自带次新/ST/停牌/科创板过滤
  universe: CSI_ALL
  # 上证红利指数当前不在 RE 指数数据里；基准曲线改用沪深300，不影响策略持仓
  benchmark: CSI300
  initial_capital: 100000
  commission_rate: 0.0001
  stamp_tax: 0.0005
  min_commission: 5
  slippage_rate: 0.002

comparison:
  price_basis: real
  strict_layers: [L0, L1, L2, L3, L4, L5]
  acceptance: diagnostic
  # 上证红利指数当前没有行情数据；RE 侧基准曲线用沪深300 代替。
  benchmark_equivalent: CSI300

tolerances:
  quantity: 0
  price_abs: 0.005
  cash_abs: 0.01
  equity_rel: 1.0e-6
  return_abs: 1.0e-3
  metric_rel: 1.0e-3
