schema_version: 1
name: growth_multifactor
description: 成长多因子（最新版）：周频调仓、5 只、ROE 改善+PEG。收益层对账：只有聚宽导出的收益曲线，L1–L3 暂不比对。

jq:
  backtest_id: "company-latest-growth_multifactor"
  frequency: day
  run_time: "09:40"
  start: "2016-09-30"
  end: "2026-09-30"
  initial_cash: 1000000
  benchmark: "000905.XSHG"
  options:
    use_real_price: true
    slippage: 0.0
    commission: 0.0003
    stamp_tax: 0.001
    min_commission: 5

svquant:
  engine_mode: event
  strategy_source: jq_strategy.py
  strategy_dialect: joinquant
  timed_execution: true
  execution_timing: next_open
  execution_price_source: unadjusted
  universe: CSI_ALL
  benchmark: CSI500
  initial_capital: 1000000
  commission_rate: 0.0003
  stamp_tax: 0.001
  min_commission: 5
  slippage_rate: 0.0

comparison:
  price_basis: real
  # 只有收益曲线：只比参数/日历、每日与累计收益、收益指标。
  layers: [L0, L4, L5]
  strict_layers: [L0, L4, L5]
  acceptance: diagnostic

tolerances:
  return_abs: 1.0e-3
  metric_rel: 1.0e-3
